# XcodeGen spec for CYCLIFT LAB — the separate prototype app (demo data only). Not the production app: see project.yml.
# No Watch app, no entitlements, no background modes, no Bluetooth or location permission text, no account keys.
# The .xcodeproj is generated on the GitHub macOS runner (never committed), so nobody needs to open Xcode.
# Signing team and build number are passed in by CI (ios/ci/build.sh); nothing secret lives in this file.
name: CycliftLab
options:
  bundleIdPrefix: com.ralsuwaidico
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"

settings:
  base:
    SUPABASE_URL: ""
    SUPABASE_ANON_KEY: ""
    GOOGLE_WEB_CLIENT_ID: ""
    GOOGLE_IOS_CLIENT_ID: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  CycliftLab:
    type: application
    platform: iOS
    sources:
      - path: BikeComputer
        excludes: ["PrivacyInfo.xcprivacy", "Info.plist", "BikeComputer.entitlements"]
      - path: BikeComputer/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    dependencies:
      # compiled because the shared code imports it; with no keys in this file no client is ever created
      - package: Supabase
        product: Supabase
    info:
      path: build/lab-gen/Info.plist
      properties:
        CFBundleDisplayName: Cyclift Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Present only so shared code that mentions Apple Health cannot crash; with no HealthKit entitlement iOS refuses every request.
        NSHealthShareUsageDescription: Cyclift Lab is a prototype with demo data. It does not read Apple Health.
        NSHealthUpdateUsageDescription: Cyclift Lab is a prototype with demo data. It does not write to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.cycliftlab
        PRODUCT_NAME: CycliftLab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CYCLIFT_LAB"

schemes:
  CycliftLab:
    build:
      targets:
        CycliftLab: all
    archive:
      config: Release

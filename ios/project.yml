# XcodeGen spec for the Cyclift iPhone + Apple Watch apps (product/bundle ids keep the original BikeComputer names).
# The .xcodeproj is generated on the GitHub macOS runner (never committed), so nobody needs to open Xcode.
# Signing team and build number are passed in by CI (ios/ci/build.sh); nothing secret lives in this file.
name: BikeComputer
options:
  bundleIdPrefix: com.ralsuwaidico
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"

settings:
  base:
    SUPABASE_URL: ""
    SUPABASE_ANON_KEY: ""
    GOOGLE_WEB_CLIENT_ID: ""
    GOOGLE_IOS_CLIENT_ID: ""
    CYCLIFT_SUPPORT_EMAIL: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  BikeComputer:
    type: application
    platform: iOS
    sources:
      - BikeComputer
      - Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: BikeComputerWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: BikeComputer/Info.plist
      properties:
        CFBundleDisplayName: Cyclift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ralsuwaidico.bikecomputer.auth
            CFBundleURLSchemes: [com.ralsuwaidico.bikecomputer]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        CYCLIFT_SUPPORT_EMAIL: $(CYCLIFT_SUPPORT_EMAIL)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, location]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Athletics uses Bluetooth to connect to your BikeComputer cycling device, send it your phone's GPS and show its live power and cadence during rides.
        NSLocationWhenInUseUsageDescription: Athletics uses your location to record speed, distance and the route of your rides, and to send GPS to your BikeComputer device.
        NSLocationAlwaysAndWhenInUseUsageDescription: Athletics records speed, distance and the route while a ride is in progress, including when the screen is locked. Location is never used when no ride is running.
        NSHealthShareUsageDescription: Athletics reads your heart rate during workouts and, if you choose, your past cycling and strength workouts, to show them in your training plan and history.
        NSHealthUpdateUsageDescription: Athletics can save your finished rides and strength sessions to Apple Health when you choose to.
    entitlements:
      path: BikeComputer/BikeComputer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer
        PRODUCT_NAME: BikeComputer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BikeComputerWatch:
    type: application
    platform: watchOS
    sources:
      - BikeComputerWatch
      - Shared
    info:
      path: BikeComputerWatch/Info.plist
      properties:
        CFBundleDisplayName: Cyclift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ralsuwaidico.bikecomputer
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Athletics reads your live heart rate during a cycling workout and sends it to your iPhone and BikeComputer device.
        NSHealthUpdateUsageDescription: Athletics records your cycling workout so the watch can measure heart rate. You choose whether it is saved to Apple Health.
    entitlements:
      path: BikeComputerWatch/BikeComputerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.watchkitapp
        PRODUCT_NAME: BikeComputerWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  BikeComputerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BikeComputerTests
        excludes: ["Resources/**"]
      - path: BikeComputerTests/Resources/coach
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BikeComputer

  # Launch smoke tests (fresh install + upgrade from an older store). Run in Release on the simulator by ci/build.sh,
  # because the shipped app is a Release build and a Release-only crash must fail CI before anything is archived.
  BikeComputerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BikeComputerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BikeComputer
    dependencies:
      - target: BikeComputer

schemes:
  BikeComputer:
    build:
      targets:
        BikeComputer: all
        BikeComputerTests: [test]
        BikeComputerUITests: [test]
    test:
      config: Debug
      targets:
        - BikeComputerTests
        - BikeComputerUITests
    archive:
      config: Release

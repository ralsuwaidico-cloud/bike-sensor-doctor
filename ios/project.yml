# XcodeGen spec for the Cyclift iPhone + Apple Watch apps (product/bundle ids keep the original BikeComputer names).
# The .xcodeproj is generated on the GitHub macOS runner (never committed), so nobody needs to open Xcode.
# Signing team and build number are passed in by CI (ios/ci/build.sh); nothing secret lives in this file.
name: BikeComputer
options:
  bundleIdPrefix: com.ralsuwaidico
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"

settings:
  base:
    SUPABASE_URL: ""
    SUPABASE_ANON_KEY: ""
    GOOGLE_WEB_CLIENT_ID: ""
    GOOGLE_IOS_CLIENT_ID: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  BikeComputer:
    type: application
    platform: iOS
    sources:
      - path: BikeComputer
        excludes: ["PrivacyInfo.xcprivacy"]
      # privacy manifest (App Store requirement): explicitly a bundle resource, whatever XcodeGen infers for the type
      - path: BikeComputer/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    dependencies:
      # Accounts/sync (Supabase) stay compiled for 1.1 but are switched off in 1.0 by ReleaseFlags.accountsEnabled:
      # no client is created and no request is made. The package ships its own privacy manifest.
      - package: Supabase
        product: Supabase
      - target: BikeComputerWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: BikeComputer/Info.plist
      properties:
        CFBundleDisplayName: Cyclift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ralsuwaidico.bikecomputer.auth
            CFBundleURLSchemes: [com.ralsuwaidico.bikecomputer]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        # public support contact chosen by the owner (1.0 decisions); static, not a build variable
        CYCLIFT_SUPPORT_EMAIL: ralsuwaidico@gmail.com
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, location]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Cyclift uses Bluetooth to connect to the fitness sensors and the optional BikeComputer device you pair (heart rate, power, speed and cadence) and show their live data during rides.
        NSLocationWhenInUseUsageDescription: Cyclift uses your location while you record a ride, also with the screen locked, to measure speed, distance and your route, and to send your position to the optional BikeComputer device if you use one.
        NSHealthShareUsageDescription: Cyclift reads your cycling and strength workouts from Apple Health, if you allow it, to show them in your training plan and history, and reads heart rate for the Cyclift Apple Watch workout.
        NSHealthUpdateUsageDescription: Cyclift saves the cycling workouts you record with the Cyclift Apple Watch app to Apple Health when you choose Save.
    entitlements:
      path: BikeComputer/BikeComputer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer
        PRODUCT_NAME: BikeComputer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BikeComputerWatch:
    type: application
    platform: watchOS
    sources:
      - path: BikeComputerWatch
        excludes: ["PrivacyInfo.xcprivacy"]
      - path: BikeComputerWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    info:
      path: BikeComputerWatch/Info.plist
      properties:
        CFBundleDisplayName: Cyclift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ralsuwaidico.bikecomputer
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Cyclift reads your live heart rate during a cycling workout and sends it to your iPhone (and a paired BikeComputer device).
        NSHealthUpdateUsageDescription: Cyclift records your cycling workout so the watch can measure heart rate. You choose whether it is saved to Apple Health.
    entitlements:
      path: BikeComputerWatch/BikeComputerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.watchkitapp
        PRODUCT_NAME: BikeComputerWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  BikeComputerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BikeComputerTests
        excludes: ["Resources/**"]
      - path: BikeComputerTests/Resources/coach
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BikeComputer

  # Launch smoke tests (fresh install + upgrade from an older store). Run in Release on the simulator by ci/build.sh,
  # because the shipped app is a Release build and a Release-only crash must fail CI before anything is archived.
  BikeComputerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BikeComputerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralsuwaidico.bikecomputer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BikeComputer
    dependencies:
      - target: BikeComputer

schemes:
  BikeComputer:
    build:
      targets:
        BikeComputer: all
        BikeComputerTests: [test]
        BikeComputerUITests: [test]
    test:
      config: Debug
      targets:
        - BikeComputerTests
        - BikeComputerUITests
    archive:
      config: Release

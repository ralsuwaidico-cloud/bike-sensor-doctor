<title>Scientific Coach Rider Setup</title>
<meta name="description" content="Bike Computer onboarding, rider profile, personalised workout, live coaching and post-ride feedback, demonstrated on Rashed's real rides">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a dark instrument panel (Design 7). Left: the phone dashboard replaying the ride. Right: the coach's
   log and memory. Below: the three-ride comparison and the plain-English verdict. Single committed dark look. */
:root{
  --bg:#060a0d; --bg2:#0b1116; --panel:#101a21; --panel2:#0a1015; --line:#1d2a33; --track:#16242b;
  --fg:#eef4f7; --mut:#8396a0; --faint:#5a6b74; --ink:#05121a;
  --cyan:#34e7e4; --green:#56e08c; --lime:#a6e22e; --amber:#ffb64d; --orange:#ff8a3d; --red:#ff5a5a; --violet:#9b8cff; --grey:#7e8c93;
  --real:#56e08c; --sim:#ffb64d; --proto:#9b8cff;
  --display:Rajdhani,"Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --cue:Archivo,"Arial Black",Impact,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:14px}
.wrap{max-width:1220px;margin:0 auto;padding-block:24px;padding-left:16px;padding-right:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.5vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,26px);margin:0 0 6px}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:500}
.ey{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.sub{color:var(--mut);max-width:72ch}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;border-radius:5px;padding:1px 7px;font-weight:700;vertical-align:middle}
.tag.real{color:var(--real);background:rgba(86,224,140,.14);border:1px solid rgba(86,224,140,.5)}
.tag.sim{color:var(--sim);background:rgba(255,182,77,.14);border:1px solid rgba(255,182,77,.5)}
.tag.proto{color:var(--proto);background:rgba(155,140,255,.14);border:1px solid rgba(155,140,255,.5)}
.tag.now{color:var(--cyan);background:rgba(52,231,228,.12);border:1px solid rgba(52,231,228,.5)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 0;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 14px;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;border:0;color:var(--mut);font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-family:var(--cue);font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);letter-spacing:.02em}
.btn.play{background:var(--green)} .btn.pause{background:var(--amber)} .btn.reset{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.clock{font-family:var(--mono);font-size:13px;color:var(--mut);margin-left:auto;font-variant-numeric:tabular-nums}
.clock b{color:var(--fg);font-weight:500}
.scrub{width:100%;margin:4px 0 0;accent-color:var(--cyan)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.phone{background:#000;border:2px solid #1b2a31;border-radius:26px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:340px}
.phone svg{display:block;border-radius:19px;width:100%;height:auto}
.col{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card.cue{border-left:3px solid var(--cyan)}
.log{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.ent{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.ent .t{font-family:var(--mono);font-size:11px;color:var(--mut);padding-top:3px;font-variant-numeric:tabular-nums}
.ent .h{font-family:var(--cue);font-weight:800;font-size:13px;letter-spacing:.02em}
.ent .w{font-size:12px;color:var(--mut);margin-top:2px}
.ent.latest{border-color:var(--cyan)}
.memo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.memo ul{margin:4px 0 0;padding-left:18px;font-size:12.5px}
.memo li{margin:3px 0}
.kv{font-family:var(--mono);font-size:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.kv span:nth-child(even){color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--mut)}

/* comparison */
section.block{margin-top:40px;border-top:1px solid var(--line);padding-top:24px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left;color:var(--mut);font-family:var(--mono);font-size:12px}
th{color:var(--mut);font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.good{color:var(--green)} td.warn{color:var(--amber)} td.na{color:var(--faint);font-style:italic}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.chart svg{width:100%;height:auto;display:block}
.qa{display:grid;gap:14px}
.qa .card h3{color:var(--cyan)}
.qa p{margin:0;font-size:14px}
.feat td:nth-child(2){text-align:left}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;margin-top:16px;color:var(--mut);font-size:13px}
.prose{max-width:72ch;color:#c7d3d9;font-size:14px}
.prose p{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- app frame (the phone running Bike Computer) ---- */
.appframe{background:#000;border:2px solid #1b2a31;border-radius:26px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:380px;min-width:0;font-family:var(--body)}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.appbar .mono{color:var(--faint);letter-spacing:.06em}
.linkbtn{background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10px;cursor:pointer;text-decoration:underline;padding:0}
.scr{background:var(--bg);border-radius:18px;min-height:420px;padding:12px 12px;color:var(--fg)}
.scr .phone{max-width:none;padding:0;border:0;box-shadow:none;background:transparent;margin-top:8px}
.scr .bar{margin:0 0 8px;padding:8px}
.scr .bar .seg button{padding:6px 8px;font-size:11px}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:30px}
.big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--mut);font-size:13px;margin:0}
.small{font-size:12px}
.btn.wide{width:100%;padding:14px}
.btn.finish{background:var(--red);width:100%;margin-top:6px}
.btn:disabled{opacity:.35;cursor:default}
.qwrap{display:flex;flex-direction:column;gap:10px}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--cyan)}
.q{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.q.small{font-size:17px;margin-top:6px}
.why{color:var(--mut);font-size:12.5px;margin:-4px 0 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;text-align:left;font-size:14px;cursor:pointer;font-family:var(--body)}
.opt.on{border-color:var(--cyan);background:rgba(52,231,228,.12);color:var(--cyan)}
.opt.small{padding:7px 10px;font-size:12px;border-radius:9px}
.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num input[type=number]{width:120px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:18px;font-family:var(--mono)}
.num input[type=range]{flex:1 1 160px;accent-color:var(--cyan);min-width:0}
.num output{font-family:var(--display);font-size:28px;font-weight:700;min-width:110px}
.num.two{flex-direction:column;align-items:stretch}.num.two label{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;gap:10px}
.nav{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.nav .btn{padding:10px 14px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h3{margin-bottom:4px}.box p{margin:0;font-size:13.5px}.box ul{margin:4px 0 0;padding-left:18px;font-size:13px}.box li{margin:3px 0}
.box.rec{border-color:var(--green)}
.recname{font-family:var(--cue);font-weight:800;font-size:19px;line-height:1.2}
.recline{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--cyan);margin-top:6px}
.alts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.kv.prof{font-family:var(--body);font-size:13px;gap:5px 10px}.kv.prof span:nth-child(odd){font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.rules{margin:0;padding-left:16px;font-size:12.5px}.rules li{margin:5px 0}
.tag.conf{color:var(--green);background:rgba(86,224,140,.14);border:1px solid rgba(86,224,140,.5)}
.tag.prov{color:var(--amber);background:rgba(255,182,77,.14);border:1px solid rgba(255,182,77,.5)}
.main{grid-template-columns:minmax(300px,400px) minmax(0,1fr)}
@media (max-width:800px){.main{grid-template-columns:1fr}.appframe{max-width:100%}}

/* ---- compact onboarding controls ---- */
.dots{display:flex;gap:6px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.done{background:var(--cyan);opacity:.55}.dots i.cur{background:var(--cyan)}
.pbody{display:flex;flex-direction:column;gap:6px}
.fl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.opt-tag{color:var(--faint);text-transform:none;letter-spacing:0;font-size:10px}
.segc{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.2;cursor:pointer;font-family:var(--body);min-height:40px;flex:1 1 auto;text-align:center}
.segc.grid2{display:grid;grid-template-columns:1fr 1fr}.segc.grid3{display:grid;grid-template-columns:1fr 1fr 1fr}.segc.days{display:grid;grid-template-columns:repeat(7,1fr)}.segc.days .chip{padding:7px 2px;font-size:11.5px;min-height:34px}.segc.tiny .chip{padding:6px 6px;font-size:11.5px;min-height:32px}
.chip.on{border-color:var(--cyan);background:rgba(52,231,228,.14);color:var(--cyan);font-weight:600}
.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nin{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);min-width:0}
.nin input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 10px;font-size:18px;font-family:var(--mono);min-width:0}
.sl{display:flex;align-items:center;gap:10px}.sl output{font-family:var(--display);font-size:24px;font-weight:700;min-width:84px}.sl input{flex:1;accent-color:var(--cyan);min-width:0}
.adv{border:1px solid var(--line);border-radius:10px;padding:6px 10px}.adv summary{cursor:pointer;color:var(--cyan);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}.adv[open] summary{margin-bottom:4px}
.mbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;align-items:center}.mrow .ml{font-size:13px;color:var(--fg)}.mrow .nin{flex-direction:row;align-items:center;gap:6px}.mrow .nin span{display:none}.mrow .nin input{padding:8px;font-size:15px;width:84px}.mrow .segc{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.mrow .segc .chip{padding:5px 6px;min-height:28px;font-size:11px;border-radius:7px}.mrow .nin input{width:100%}
.editrow{display:flex;flex-wrap:wrap;gap:4px 12px}.editrow .linkbtn{color:var(--cyan);font-size:11px}
.box.fu{border-color:var(--violet)}
@media (max-width:400px){.row3{grid-template-columns:1fr 1fr 1fr}.two-col{grid-template-columns:1fr}}
</style>

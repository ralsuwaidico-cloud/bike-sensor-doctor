; Cyclift Watch OS — LILYGO T-Watch 2021 (round, T-Micro32 Plus, GC9A01)
; Board revisions (read the silkscreen): V1.0 → T-Watch-2021-V1_0 · V1.1 → T-Watch-2021-V1_1 (default) · V2 → T-Watch-2021-V2
; The `native` environment builds the pure domain code and its host tests on a PC (no hardware, no flashing).
[platformio]
; Toolchain pinned 9 Nov 2026 to the exact versions of the validated build (CI run 42604797422): platform espressif32 8.0.0,
; Arduino-ESP32 3.3.12 (ESP-IDF 5.5 family), xtensa GCC 14.2.0+20260121, esptool 5.4.0. tools/v3/check_versions.py fails CI
; if anything resolves to a different version (see tools/v3/pinned_versions.json).
default_envs = native

[env]
build_flags = -std=gnu++17 -Wall -Wextra

; ---------------------------------------------------------------- host-side tests (run with: pio test -e native, or make -C test/host)
[env:native]
platform = native
build_flags = ${env.build_flags} -DCYW_HOST
build_src_filter = +<domain/>
test_framework = unity

; ---------------------------------------------------------------- the watch (not flashed until the owner authorises it)
[env:twatch2021]
platform = platformio/espressif32 @ 8.0.0
platform_packages =
  platformio/framework-arduinoespressif32 @ 4.30312.261024
  platformio/framework-arduinoespressif32-esp32-libs @ 3.3.12
  platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
  platformio/tool-esptool @ 2.50400.0
board = esp32dev
framework = arduino
; Stage 2a (9 Nov 2026): the owner's watch was read: ESP32-PICO-V3-02, 8 MB flash; factory bootloader runs DIO at 40 MHz.
; esp32dev defaults to 4 MB, so the 8 MB size must be stated or the bootloader rejects partitions above 0x400000.
; First hardware tests use the factory-compatible DIO 40 MHz; QIO/80 MHz only after it is proven on the watch.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = boards/partitions_8mb_ota.csv
board_build.filesystem = littlefs
build_flags = ${env.build_flags}
  -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE -DLV_CONF_PATH="${PROJECT_DIR}/src/ui/lv_conf.h"
  ; TFT_eSPI is configured from here (no User_Setup.h edits): GC9A01 on the V1.x SPI pins; V2 overrides below
  -DUSER_SETUP_LOADED=1 -DGC9A01_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=240
  -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=19 -DTFT_RST=27 -DTFT_BL=21 -DTFT_MISO=-1
  -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=20000000 -DLOAD_GLCD=1 -DSMOOTH_FONT=0
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  lvgl/lvgl @ 8.4.0
  h2zero/NimBLE-Arduino @ 1.4.3
build_src_filter = +<*> -<../test/>

[env:T-Watch-2021-V1_1]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V1_1

[env:T-Watch-2021-V1_0]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V1_0

[env:T-Watch-2021-V2]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V2 -UTFT_MOSI -UTFT_SCLK -UTFT_CS -UTFT_DC -UTFT_RST -DTFT_MOSI=23 -DTFT_SCLK=18 -DTFT_CS=5 -DTFT_DC=22 -DTFT_RST=-1

; M1 diagnostics build (owner approval needed before flashing): read-only probes, display test pattern, touch/key echo
[env:T-Watch-2021-V1_1-diag]
extends = env:T-Watch-2021-V1_1
build_flags = ${env:T-Watch-2021-V1_1.build_flags} -DCYW_DIAG

; ---------------------------------------------------------------- v3 Stage 1 proof of concept (separate program; NOT FLASHED)
; Approved v3 screens (Orbit face, app menu, cycling cockpit) with simulated ride data and a simulated iPhone. Builds only
; ui/v3/, app/v3poc_main.cpp and the HAL; app/main.cpp and the existing environments above are untouched. No Bluetooth.
[v3poc]
platform = platformio/espressif32 @ 8.0.0
platform_packages =
  platformio/framework-arduinoespressif32 @ 4.30312.261024
  platformio/framework-arduinoespressif32-esp32-libs @ 3.3.12
  platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
  platformio/tool-esptool @ 2.50400.0
board = esp32dev
framework = arduino
; Stage 2a (9 Nov 2026): the owner's watch was read: ESP32-PICO-V3-02, 8 MB flash; factory bootloader runs DIO at 40 MHz.
; esp32dev defaults to 4 MB, so the 8 MB size must be stated or the bootloader rejects partitions above 0x400000.
; First hardware tests use the factory-compatible DIO 40 MHz; QIO/80 MHz only after it is proven on the watch.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = boards/partitions_8mb_ota.csv
build_flags = ${env.build_flags}
  -DCYW_V3POC
  -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE -DLV_CONF_PATH="${PROJECT_DIR}/src/ui/v3/lv_conf_v3.h"
  -DUSER_SETUP_LOADED=1 -DGC9A01_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=240 -DTFT_MISO=-1 -DTFT_BL=21
  -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=20000000 -DLOAD_GLCD=1 -DSMOOTH_FONT=0
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  lvgl/lvgl @ 8.3.11
  h2zero/NimBLE-Arduino @ 1.4.3
build_src_filter = -<*> +<ui/v3/> +<app/v3poc_main.cpp>

[env:T-Watch-2021-V1_1-v3poc]
extends = v3poc
build_flags = ${v3poc.build_flags} -DCYW_BOARD_V1_1 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=19 -DTFT_RST=27

[env:T-Watch-2021-V1_0-v3poc]
extends = v3poc
build_flags = ${v3poc.build_flags} -DCYW_BOARD_V1_0 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=19 -DTFT_RST=27

[env:T-Watch-2021-V2-v3poc]
extends = v3poc
build_flags = ${v3poc.build_flags} -DCYW_BOARD_V2 -DTFT_MOSI=23 -DTFT_SCLK=18 -DTFT_CS=5 -DTFT_DC=22 -DTFT_RST=-1

; ---------------------------------------------------------------- Stage 2a boot probe (EMULATOR ONLY — never flashed)
; Tiny test program booted in QEMU by tools/stage2a/boot_sim.py to check the factory-preserving plan against the factory
; bootloader. Same pinned toolchain and flash settings as the real firmware.
[bootprobe]
extends = v3poc
board_build.partitions = boards/partitions_factory_preserving.csv
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1
lib_deps =
build_src_filter = -<*> +<app/stage2a_bootprobe.cpp>

[env:stage2a-bootprobe-factory-standin]
extends = bootprobe
build_flags = ${bootprobe.build_flags} -DBOOTPROBE_ROLE_ID=1

[env:stage2a-bootprobe-cyclift]
extends = bootprobe
build_flags = ${bootprobe.build_flags} -DBOOTPROBE_ROLE_ID=2

[env:stage2a-bootprobe-crash]
extends = bootprobe
build_flags = ${bootprobe.build_flags} -DBOOTPROBE_ROLE_ID=3

; ---------------------------------------------------------------- Stage 1 display diagnostic (V1.1 pins) — NOT approved for installation
; Separate tiny program to find the Stage 1 black screen: backlight IO21 (GPIO and PWM), TFT_eSPI panel test, and an independent
; raw-SPI GC9A01 driver with the factory firmware's init sequence. No BLE / Wi-Fi / sleep / sensors. Verbose core logging.
[env:T-Watch-2021-V1_1-display-diag]
extends = v3poc
build_flags = ${env.build_flags} -DCYW_DISPLAY_DIAG -DCYW_BOARD_V1_1 -DCORE_DEBUG_LEVEL=5
  -DUSER_SETUP_LOADED=1 -DGC9A01_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=240 -DTFT_MISO=-1 -DTFT_BL=21
  -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=20000000 -DLOAD_GLCD=1 -DSMOOTH_FONT=0
  -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=19 -DTFT_RST=27
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
build_src_filter = -<*> +<app/stage1_display_diag.cpp>

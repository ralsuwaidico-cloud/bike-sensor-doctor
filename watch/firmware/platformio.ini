; Cyclift Watch OS — LILYGO T-Watch 2021 (round, T-Micro32 Plus, GC9A01)
; Board revisions (read the silkscreen): V1.0 → T-Watch-2021-V1_0 · V1.1 → T-Watch-2021-V1_1 (default) · V2 → T-Watch-2021-V2
; The `native` environment builds the pure domain code and its host tests on a PC (no hardware, no flashing).
[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17 -Wall -Wextra

; ---------------------------------------------------------------- host-side tests (run with: pio test -e native, or make -C test/host)
[env:native]
platform = native
build_flags = ${env.build_flags} -DCYW_HOST
build_src_filter = +<domain/>
test_framework = unity

; ---------------------------------------------------------------- the watch (not flashed until the owner authorises it)
[env:twatch2021]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = boards/partitions_8mb_ota.csv
board_build.filesystem = littlefs
build_flags = ${env.build_flags}
  -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE -DLV_CONF_PATH="${PROJECT_DIR}/src/ui/lv_conf.h"
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  lvgl/lvgl @ ^8.3.11
  h2zero/NimBLE-Arduino @ ^1.4.2
build_src_filter = +<*> -<../test/>

[env:T-Watch-2021-V1_1]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V1_1

[env:T-Watch-2021-V1_0]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V1_0

[env:T-Watch-2021-V2]
extends = env:twatch2021
build_flags = ${env:twatch2021.build_flags} -DCYW_BOARD_V2

# Fast checks (CI improvement 3, 28 Oct 2026): the coaching engine, weekly totals, Home model and Progress maths, on Linux in
# about 3 minutes, on every push that touches the app's logic. Runs next to (not instead of) the macOS iOS workflow, so a
# logic error shows up in minutes instead of after the 100-minute iOS run. Nothing is built for a device, nothing uploaded.
name: Fast logic tests
on:
  push:
    branches: ["ios/**", "fix/**", "fw/**"]
    paths: ["ios/BikeComputer/**", "ios/BikeComputerTests/**", "ios/Shared/**", "tools/coach-harness/**", ".github/workflows/logic.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
      - name: Engine, Home and Progress logic tests (Linux Swift)
        shell: bash
        run: |
          start=$(date +%s)
          set +e   # run 129: with -e the step died on the failing test.sh before any of the reporting below ran
          # E1-A4: stores written by the BUILD-216 code itself (commit fb52ae27), then opened by this commit's code.
          # Synthetic athletes only. If the fixtures cannot be produced the upgrade test FAILS (it never skips quietly).
          export FIXTURES_216="$GITHUB_WORKSPACE/fixtures216"; mkdir -p "$FIXTURES_216"
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          if git fetch -q --depth 1 origin fb52ae27403a8f2703657321ea45406b62832ea6 && git worktree add -q /tmp/b216 FETCH_HEAD; then
            FIXTURE_OUT="$FIXTURES_216" TESTS=none EXTRA="$GITHUB_WORKSPACE/tools/coach-harness/fixtures216/Fixture216Generator.swift" bash tools/coach-harness/test.sh /tmp/b216 > fixtures216.txt 2>&1 || true
            echo "== build-216 fixtures: $(ls "$FIXTURES_216" | tr '\n' ' ')"; tail -5 fixtures216.txt
          else echo "== build-216 fixtures: could not fetch commit fb52ae27"; fi
          bash tools/coach-harness/test.sh "$GITHUB_WORKSPACE" > logic.txt 2>&1; X=$?
          set -e
          # E1: name every failing test. The tail alone hid a failure in a suite that sorts early (logic run 81).
          [ $X -eq 0 ] || { echo "== failing tests and their messages:"; grep -E ": error: |Test Case .* failed|Fatal error|became|missing after save|type changed" logic.txt | cut -c1-600 | head -160; }
          # logic run 86: on success the totals were not in the log at all; print them and every skipped test by name
          echo "== totals:"; grep -E "Executed [0-9]+ tests" logic.txt | tail -1; echo "== skipped tests:"; grep -E "skipped|Skip" logic.txt | cut -c1-300 | head -20 || true
          echo "== evidence lines printed by the E1 tests:"; grep -E "^E1-" logic.txt | cut -c1-600 | head -60 || true
          [ $X -eq 0 ] || { echo "== test.sh failed (exit $X); last 60 lines:"; tail -60 logic.txt; echo "== build.log errors:"; grep -E "error:" tools/coach-harness/testws/build.log 2>/dev/null | head -20; }
          dur=$(( $(date +%s) - start ))
          R=ok; [ $X -eq 0 ] || R="FAILED (exit $X)"
          W=tools/coach-harness/testws
          {
            echo "### Fast logic tests: $R"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\` · ${dur}s"
            echo ""
            echo '```'
            grep -E "error:|failed \(|Executed [0-9]+ tests" logic.txt | tail -25 || true
            [ $X -eq 0 ] || tail -40 logic.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # annotations are readable through the API even where raw logs are not (the owner's tools read them)
          echo "::notice title=Fast logic tests::$R in ${dur}s — $(grep -Eo 'Executed [0-9]+ tests?, with ([0-9]+ tests? skipped and )?[0-9]+ failures?' logic.txt | tail -1)"
          if [ $X -ne 0 ]; then
            { grep -E "error:|failed \(" logic.txt; grep -E "error:" $W/build.log 2>/dev/null; tail -15 logic.txt; } | head -30 | while IFS= read -r l; do echo "::error title=logic::${l//%/%25}"; done
          fi
          exit $X

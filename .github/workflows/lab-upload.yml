# Cyclift Lab — TestFlight upload. Owner approval of 19 Nov 2026, 17:07 (Dubai): Cyclift Lab 0.1.0 build 6 built
# exclusively from commit 9b9d3a6878bcc44473178bca2df0ca0432384fdb, internal testers only, using the signed-app checks.
# (Earlier: 59e2f033 as build 3, 16 Nov; 8ba4f4e1 as build 4, 18 Nov; b48f6c58 as build 5, 19 Nov 2026.) This workflow uploads NOTHING ELSE:
# the approved commit is fixed below, the run checks out exactly that commit before anything is built — so no newer
# development commit can be in the app — and the upload is refused unless every check on the signed app passes. The
# file that is checked is the file that is uploaded (same run, same .ipa). It never touches the production Cyclift
# app or its testers.
name: Cyclift Lab — TestFlight upload
on:
  push:
    branches: ["ios/lab"]
    paths: ["tools/lab/UPLOAD_APPROVED"]
permissions:
  contents: read
concurrency:
  group: lab-upload
  cancel-in-progress: false
env:
  APPROVED: 9b9d3a6878bcc44473178bca2df0ca0432384fdb
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      build: ${{ steps.n.outputs.build }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: n
        name: Approved commit, checked out exactly
        run: |
          [ "$(head -1 tools/lab/UPLOAD_APPROVED | tr -dc 'a-f0-9')" = "$APPROVED" ] || { echo "UPLOAD_APPROVED does not name the approved commit"; exit 1; }
          git checkout -q "$APPROVED" || { echo "REFUSED: the approved commit could not be checked out"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$APPROVED" ] || { echo "REFUSED: the working copy is not the approved commit"; exit 1; }
          git diff --quiet "$APPROVED" -- . && [ -z "$(git status --porcelain)" ] || { echo "REFUSED: the working copy differs from the approved commit"; exit 1; }
          echo "building exactly $APPROVED (app source tree $(git rev-parse HEAD:ios)); nothing newer is present"
          echo "build=$(( ${{ github.run_number }} + 2 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ios/build/spm
          key: spm-v1-${{ hashFiles('ios/project.yml') }}
      - name: Sign, check the signed app, upload only if every check passes
        env:
          BUILD_NUMBER: ${{ steps.n.outputs.build }}
          LAB_SOURCE_COMMIT: ${{ env.APPROVED }}
          LAB_UPLOAD_APPROVED: ${{ env.APPROVED }}
        run: bash tools/lab/release.sh
  testflight:
    needs: [upload]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Internal group, tester, processing state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ needs.upload.outputs.build }}
          COMMIT: ${{ env.APPROVED }}
        run: set -o pipefail; python3 tools/lab/testflight.py 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail hidden>/g'

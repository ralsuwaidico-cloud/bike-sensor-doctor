# BikeComputer iPhone + Apple Watch apps: compiled, tested, signed and delivered to TestFlight on GitHub's macOS
# servers. Nobody needs a Mac or Xcode. See ios/SETUP.md.
#
#  job apple : (Linux) registers bundle IDs + HealthKit, checks the App Store Connect app record, keeps the private
#              internal TestFlight group ready. Skipped quietly until the secrets exist.
#  job build : (macOS 26 / Xcode 26) generates the project, runs unit tests on the iOS simulator, archives, signs for
#              App Store with Apple's cloud-managed certificate, verifies signatures + entitlements, uploads to TestFlight
#              when the commit message contains [testflight] or the run is started with upload = true.
#
# Security: all credentials come from repository secrets; logs leaving the runner are scrubbed (this repo is public).
# Only internal TestFlight testers ever receive builds. External testing / App Store release is never done here.
name: iOS apps
on:
  push:
    branches: ["ios/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (internal testers only)"
        type: boolean
        default: false
      scope:
        description: "full = tests + layout + archive (default); ui = layout audit only (fast UI re-check, never uploads)"
        type: choice
        options: [full, ui]
        default: full
      devices:
        description: "Layout audit devices (comma list of small,standard,promax,owner)"
        type: string
        default: "small,standard,promax,owner"
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple:
    runs-on: ubuntu-latest
    outputs:
      app_ready: ${{ steps.asc.outputs.app_ready }}
      secrets: ${{ steps.asc.outputs.secrets }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - id: asc
        name: App Store Connect setup
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 ios/ci/asc.py 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail hidden>/g' > asc.txt || echo "SETUP FAILED" >> asc.txt
          cat asc.txt
          grep -q "app_ready=true" "$GITHUB_OUTPUT" || echo "app_ready=false" >> "$GITHUB_OUTPUT"
      - name: Keep the setup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-setup
          path: asc.txt
          if-no-files-found: ignore
      - name: Publish the setup report to branch ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          W=$(mktemp -d); cd "$W"
          git init -q && git config user.name "ios-ci" && git config user.email "ios-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          mkdir -p "ios/run-$N" && cp "$GITHUB_WORKSPACE/asc.txt" "ios/run-$N/apple-setup.txt"
          git add -A && git commit -q -m "iOS CI apple setup run $N" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:ci-logs && break; git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true; sleep 3; done

  build:
    needs: apple
    runs-on: macos-26
    # run 116 (29 Oct): the full pipeline hit the old 150-min job limit on slow runners and the job was killed before it
    # could publish its log. The build step now has its own limit below the job's, so the log is always published.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, sign, upload
        timeout-minutes: 215
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
          LAYOUT_DEVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.devices || 'small,standard,promax,owner' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_READY: ${{ needs.apple.outputs.app_ready }}
          # account service (optional until the owner creates the Supabase project; empty = accounts off in the app)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[testflight]') }}
        run: ios/ci/build.sh
      - name: Fetch the Apple setup report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: apple-setup
          path: ios/build/logs
        continue-on-error: true
      - name: Summary
        if: always()
        run: cat ios/build/logs/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Publish the scrubbed CI log to branch ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          set -u
          W=$(mktemp -d); cd "$W"
          git init -q && git config user.name "ios-ci" && git config user.email "ios-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          mkdir -p "ios/run-$N"
          mv "$GITHUB_WORKSPACE"/ios/build/logs/asc.txt "$GITHUB_WORKSPACE"/ios/build/logs/apple-setup.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/ios/build/logs/*.txt "ios/run-$N/" 2>/dev/null || echo "no logs produced" > "ios/run-$N/summary.txt"
          # layout audit screenshots (demo data only, downscaled by ios/ci/build.sh)
          if ls "$GITHUB_WORKSPACE"/ios/build/layout/*.png >/dev/null 2>&1; then mkdir -p "ios/run-$N/layout" && cp "$GITHUB_WORKSPACE"/ios/build/layout/*.png "ios/run-$N/layout/"; fi
          echo "commit $GITHUB_SHA  branch $GITHUB_REF_NAME  job ${{ job.status }}" >> "ios/run-$N/summary.txt"
          git add -A && git commit -q -m "iOS CI log run $N"
          for i in 1 2 3; do
            git push -q origin HEAD:ci-logs && break
            git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true
            sleep 3
          done

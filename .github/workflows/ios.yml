# BikeComputer iPhone + Apple Watch apps: compiled, tested, signed and delivered to TestFlight on GitHub's macOS
# servers. Nobody needs a Mac or Xcode. See ios/SETUP.md and ios/CI_PIPELINE.md.
#
#  job apple    : (Linux) registers bundle IDs + HealthKit, checks the App Store Connect app record, keeps the private
#                 internal TestFlight groups ready. Skipped quietly until the secrets exist.
#  job mode     : (Linux) decides the scope: quick ("[ci quick]" in the head commit message, or scope=quick), ui
#                 (scope=ui: layout audit only) or full (default).
#  job quick    : (macOS) compile + unit tests + layout checks of the main screens on iPhone SE (AX3) and a standard
#                 iPhone (L). Never archives, never uploads. Not release evidence.
#  job test     : (macOS, full/ui) one parallel job per stage: unit, smoke, layout on each of 4 iPhones, watch shots.
#                 Each job builds once (build-for-testing) and runs its tests without rebuilding.
#  job release  : (macOS, full only) runs ONLY when every test job succeeded: archive, App Store signing, verification,
#                 upload when the commit message contains [testflight] or the run is started with upload = true.
#  job testflight: (Linux) after an upload, waits for Apple's processing, reports whether the build is ready to
#                 install and sets the What to Test text ("INTERNAL TEST BUILD n — not an approved release").
#  job publish  : (Linux, always) one combined scrubbed summary + logs + screenshots → branch ci-logs ios/run-N/.
#
# Security: all credentials come from repository secrets; logs leaving the runner are scrubbed (this repo is public).
# Only internal TestFlight testers ever receive builds. External testing / App Store release is never done here.
name: iOS apps
on:
  push:
    branches: ["ios/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (internal testers only)"
        type: boolean
        default: false
      layout_test:
        description: "ui scope: which screenshot test runs on the layout devices (LayoutAudit, or OnboardingScreens for the onboarding audit)"
        type: string
        default: "LayoutAudit"
      sizes:
        description: "ui scope: text sizes for every layout device (empty = each device's usual sizes), e.g. L,AX3"
        type: string
        default: ""
      scope:
        description: "full = all tests + archive (default); quick = compile + unit + main-screen layout on SE/standard (never uploads); ui = layout audit only (never uploads)"
        type: choice
        options: [full, quick, ui]
        default: full
      devices:
        description: "Layout audit devices (comma list of small,standard,promax,owner)"
        type: string
        default: "small,standard,promax,owner"
      quick_ui:
        description: "quick scope: UI test methods to run (space separated; empty = main screens)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple:
    runs-on: ubuntu-latest
    outputs:
      app_ready: ${{ steps.asc.outputs.app_ready }}
      secrets: ${{ steps.asc.outputs.secrets }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - id: asc
        name: App Store Connect setup
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_EXTERNAL_ENABLE: ${{ vars.ASC_EXTERNAL_ENABLE }}
          ASC_EXTERNAL_TESTERS: ${{ secrets.ASC_EXTERNAL_TESTERS }}
        run: |
          python3 ios/ci/asc.py 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail hidden>/g' > asc.txt || echo "SETUP FAILED" >> asc.txt
          cat asc.txt
          grep -q "app_ready=true" "$GITHUB_OUTPUT" || echo "app_ready=false" >> "$GITHUB_OUTPUT"
      - name: Keep the setup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-apple
          path: asc.txt
          if-no-files-found: ignore

  mode:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.m.outputs.scope }}
      upload: ${{ steps.m.outputs.upload }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_UPLOAD: ${{ inputs.upload }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          scope=full
          if [ "$EVENT" = workflow_dispatch ]; then scope="${IN_SCOPE:-full}"
          elif printf '%s' "$MSG" | grep -qF '[ci quick]'; then scope=quick; fi
          upload=false
          if [ "$scope" = full ]; then
            if [ "$EVENT" = workflow_dispatch ]; then [ "$IN_UPLOAD" = true ] && upload=true
            else printf '%s' "$MSG" | grep -qF '[testflight]' && upload=true; fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"; echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "scope=$scope upload=$upload"

  quick:
    needs: [apple, mode]
    if: needs.mode.outputs.scope == 'quick'
    runs-on: macos-26
    # run 138: the targeted Fix-plan audit on SE at AX3 (31 min) + the standard iPhone pushed the step past 65 min
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ios/build/spm
          key: spm-v1-${{ hashFiles('ios/project.yml') }}
      - name: Quick check (compile, unit tests, main screens on SE + standard)
        timeout-minutes: 105
        env:
          STAGE: quick
          BUILD_NUMBER: ${{ github.run_number }}
          QUICK_UI: ${{ inputs.quick_ui }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: ios/ci/build.sh
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-quick
          path: |
            ios/build/logs/*.txt
            ios/build/layout/*.png
            ios/build/layout/*.mp4
          if-no-files-found: ignore

  test:
    needs: [apple, mode]
    if: needs.mode.outputs.scope == 'full' || needs.mode.outputs.scope == 'ui'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: unit,            stage: unit,   devices: "",         minutes: 60 }
          - { job: smoke,           stage: smoke,  devices: "",         minutes: 75 }
          - { job: journeys,        stage: journeys, devices: "",       minutes: 75 }
          - { job: layout-small,    stage: layout, devices: "small",    minutes: 75 }
          - { job: layout-standard, stage: layout, devices: "standard", minutes: 60 }
          - { job: layout-promax,   stage: layout, devices: "promax",   minutes: 60 }
          - { job: layout-owner,    stage: layout, devices: "owner",    minutes: 75 }
          - { job: watch,           stage: watch,  devices: "",         minutes: 45 }
    name: test (${{ matrix.job }})
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - name: Skip what the ui scope does not run
        id: skip
        env:
          SCOPE: ${{ needs.mode.outputs.scope }}
          DEVS: ${{ inputs.devices }}
        run: |
          run=true
          if [ "$SCOPE" = ui ]; then
            case "${{ matrix.stage }}" in
              layout) case ",${DEVS:-small,standard,promax,owner}," in *",${{ matrix.devices }},"*) ;; *) run=false;; esac ;;
              *) run=false ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.skip.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.skip.outputs.run == 'true'
        with:
          path: ios/build/spm
          key: spm-v1-${{ hashFiles('ios/project.yml') }}
      - name: Stage ${{ matrix.job }}
        if: steps.skip.outputs.run == 'true'
        timeout-minutes: ${{ matrix.minutes }}
        env:
          STAGE: ${{ matrix.stage }}
          LAYOUT_DEVICES: ${{ matrix.devices }}
          BUILD_NUMBER: ${{ github.run_number }}
          LAYOUT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.layout_test || 'LayoutAudit' }}
          LAYOUT_SIZES_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.sizes || '' }}
        run: ios/ci/build.sh
      - name: Keep logs
        if: always() && steps.skip.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.job }}
          path: |
            ios/build/logs/*.txt
            ios/build/layout/*.png
            ios/build/layout/*.mp4
          if-no-files-found: ignore

  release:
    needs: [apple, mode, test]
    if: needs.mode.outputs.scope == 'full' && needs.test.result == 'success'
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      uploaded: ${{ steps.r.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ios/build/spm
          key: spm-v1-${{ hashFiles('ios/project.yml') }}
      - name: Archive, sign, verify, upload
        id: r
        timeout-minutes: 65
        env:
          STAGE: release
          TESTS_OK: ${{ needs.test.result }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_EXTERNAL_ENABLE: ${{ vars.ASC_EXTERNAL_ENABLE }}
          ASC_EXTERNAL_TESTERS: ${{ secrets.ASC_EXTERNAL_TESTERS }}
          APP_READY: ${{ needs.apple.outputs.app_ready }}
          # account service (optional until the owner creates the Supabase project; empty = accounts off in the app)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          UPLOAD: ${{ needs.mode.outputs.upload }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          ios/ci/build.sh; r=$?
          grep -q "RESULT upload: ok" ios/build/logs/summary.txt && echo "uploaded=true" >> "$GITHUB_OUTPUT" || echo "uploaded=false" >> "$GITHUB_OUTPUT"
          exit $r
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-release
          path: ios/build/logs/*.txt
          if-no-files-found: ignore

  testflight:
    needs: [release]
    if: needs.release.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Wait for TestFlight processing, set What to Test
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_EXTERNAL_ENABLE: ${{ vars.ASC_EXTERNAL_ENABLE }}
          ASC_EXTERNAL_TESTERS: ${{ secrets.ASC_EXTERNAL_TESTERS }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p tf
          python3 ios/ci/asc.py testflight 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail hidden>/g' > tf/testflight.txt || true
          cat tf/testflight.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-testflight
          path: tf/testflight.txt
          if-no-files-found: ignore

  publish:
    needs: [apple, mode, quick, test, release, testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for the source-tree hash of the quick-green marker (ios/CI_PROCESS.md)
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
        continue-on-error: true
      - name: Combined summary + publish to branch ci-logs
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
          SCOPE: ${{ needs.mode.outputs.scope }}
          R_QUICK: ${{ needs.quick.result }}
          R_TEST: ${{ needs.test.result }}
          R_RELEASE: ${{ needs.release.result }}
          R_TF: ${{ needs.testflight.result }}
        run: |
          set -u
          S="$PWD/summary.txt"; : > "$S"
          echo "BikeComputer iOS CI — run $N — scope $SCOPE — jobs: quick=$R_QUICK test=$R_TEST release=$R_RELEASE testflight=$R_TF" >> "$S"
          for j in quick unit smoke journeys layout-small layout-standard layout-promax layout-owner watch release; do
            f="logs/logs-$j/logs/summary.txt"; [ -f "$f" ] || f="logs/logs-$j/summary.txt"
            [ -f "$f" ] || continue
            echo "" >> "$S"; echo "## $j" >> "$S"; cat "$f" >> "$S"
          done
          if [ "$SCOPE" = full ] && [ "$R_TEST" != success ]; then echo "" >> "$S"; echo "RESULT upload: skipped (tests failed — the release job did not run)" >> "$S"; fi
          [ -f logs/logs-testflight/testflight.txt ] && { echo ""; echo "## testflight"; cat logs/logs-testflight/testflight.txt; } >> "$S"
          OK=success
          if [ "$SCOPE" = quick ]; then [ "$R_QUICK" = success ] || OK=failure
          else [ "$R_TEST" = success ] || OK=failure; [ "$SCOPE" = full ] && [ "$R_RELEASE" != success ] && OK=failure; fi
          echo "commit $GITHUB_SHA  branch $GITHUB_REF_NAME  job $OK" >> "$S"
          cat "$S" >> "$GITHUB_STEP_SUMMARY"
          W=$(mktemp -d); cd "$W"
          git init -q && git config user.name "ios-ci" && git config user.email "ios-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          D="ios/run-$N"; mkdir -p "$D/layout"
          for a in "$GITHUB_WORKSPACE"/logs/logs-*; do
            [ -d "$a" ] || continue; j=$(basename "$a"); j=${j#logs-}
            find "$a" -name '*.txt' ! -name summary.txt | while read -r f; do b=$(basename "$f"); [ -f "$D/$b" ] && b="$j-$b"; cp "$f" "$D/$b"; done
            [ -f "$a/asc.txt" ] && cp "$a/asc.txt" "$D/apple-setup.txt"
            find "$a" -name 'summary.txt' | head -1 | while read -r f; do cp "$f" "$D/summary-$j.txt"; done
            find "$a" -name '*.png' -exec cp {} "$D/layout/" \;
            find "$a" -name '*.mp4' -size -45000k -exec cp {} "$D/" \;   # V1 journey recordings (compressed; under 45 MB each)
          done
          rmdir "$D/layout" 2>/dev/null || true
          cp "$S" "$D/summary.txt"
          # quick-before-full markers (ios/CI_PROCESS.md): a green quick run marks this source TREE; a green full run
          # (every test job + release) becomes the base the next quick run diffs against.
          TREE=$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}' 2>/dev/null || true)
          if [ "$SCOPE" = quick ] && [ "$OK" = success ] && [ -n "$TREE" ]; then mkdir -p ios/ci/quick-green; echo "$GITHUB_SHA run $N" > "ios/ci/quick-green/$TREE"; fi
          if [ "$SCOPE" = full ] && [ "$OK" = success ]; then mkdir -p ios/ci; echo "$GITHUB_SHA" > ios/ci/last-green.txt; fi
          git add -A && git commit -q -m "iOS CI log run $N"
          for i in 1 2 3; do
            git push -q origin HEAD:ci-logs && break
            git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true
            sleep 3
          done

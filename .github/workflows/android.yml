# BikeComputer for Android (android/): Link codec unit tests + debug APK of the foundation app, on GitHub's Linux
# servers. Logs are published to branch ci-logs (android/run-N) like the iOS workflow. The original Bike Sensor Doctor
# app at the repo root keeps its own workflow (build-apk.yml).
name: Android app
on:
  push:
    branches: ["ios/**", "android/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
      - name: Link codec tests + debug APK
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p logs
          ./gradlew --no-daemon :link:test :app:assembleDebug 2>&1 | tee logs/gradle.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee logs/apk.sha256
          echo "RESULT android: ok (run ${{ github.run_number }})" | tee logs/summary.txt
      - name: Publish log to branch ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          W=$(mktemp -d); cd "$W"
          git init -q && git config user.name "android-ci" && git config user.email "android-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          mkdir -p "android/run-$N"
          cp "$GITHUB_WORKSPACE"/android/logs/* "android/run-$N/" 2>/dev/null || echo "no logs produced" > "android/run-$N/summary.txt"
          echo "commit $GITHUB_SHA  job ${{ job.status }}" >> "android/run-$N/summary.txt"
          git add -A && git commit -q -m "Android CI log run $N"
          for i in 1 2 3; do git push -q origin HEAD:ci-logs && break; git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true; sleep 3; done

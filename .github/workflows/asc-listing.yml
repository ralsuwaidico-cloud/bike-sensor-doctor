# Cyclift App Store Connect preparation — DRAFTS ONLY. It NEVER submits for review, creates a review submission,
# releases, accepts agreements or sets a paid price; those stay with the account owner.
#
# How to run (the workflow is not on the default branch yet, so it is started by pushing a trigger branch):
#   push to asc-listing/check          read-only report + submission-readiness checklist
#   push to asc-listing/apply          write draft metadata, price Free, availability, release type, content rights
#   push to asc-listing/attach-<N>     wait for build <N> of 1.0.0 to be VALID, answer export compliance, attach it
#   push to asc-listing/screenshots    take screenshots of the app code on ios/dev (simulator) and upload them
# Once this file is on the default branch it can also be started from the Actions tab or with
#   gh workflow run asc-listing.yml --ref ios/dev -f mode=screenshots     (app code = the --ref; app_ref overrides it)
#
#  job plan        : decides mode / build / app ref.
#  job screenshots : (macOS, screenshots mode only) StoreScreenshots UI test on an iPhone Pro Max simulator with a 9:41
#                    status bar (ride screen in dark appearance so the status bar is readable) + a best-effort Apple
#                    Watch screenshot. No secrets are used in this job.
#  job listing     : (Linux) ios/ci/asc_listing.py with the App Store Connect API key; publishes the scrubbed report and
#                    the screenshots to branch ci-logs under ios/asc-listing/run-N/ (this repository is public).
name: App Store listing
on:
  push:
    branches: ["asc-listing/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "check | apply | attach | screenshots (never submits)"
        type: choice
        options: [check, apply, attach, screenshots]
        default: check
      build:
        description: "attach mode: build number (CFBundleVersion) of the 1.0.0 build"
        type: string
        default: ""
      app_ref:
        description: "screenshots mode: git ref of the app code (default: the ref this run was started on)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: asc-listing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      build: ${{ steps.p.outputs.build }}
      app_ref: ${{ steps.p.outputs.app_ref }}
    steps:
      - id: p
        env:
          EV: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_BUILD: ${{ inputs.build }}
          IN_REF: ${{ inputs.app_ref }}
        run: |
          if [ "$EV" = "workflow_dispatch" ]; then
            MODE="$IN_MODE"; BUILD="$IN_BUILD"; REF="${IN_REF:-$GITHUB_SHA}"
          else
            R="${GITHUB_REF_NAME#asc-listing/}"; BUILD=""; REF="ios/dev"
            case "$R" in
              attach-*) MODE=attach; BUILD="${R#attach-}" ;;
              screenshots*) MODE=screenshots ;;
              apply*) MODE=apply ;;
              *) MODE=check ;;
            esac
          fi
          echo "mode=$MODE build=$BUILD app_ref=$REF"
          { echo "mode=$MODE"; echo "build=$BUILD"; echo "app_ref=$REF"; } >> "$GITHUB_OUTPUT"

  screenshots:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'screenshots' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.app_ref }}
      - name: Take screenshots
        run: |
          set -uo pipefail
          cd ios
          mkdir -p build/shots build/logs
          LOG=build/logs/screenshots.txt
          echo "App code: ${{ needs.plan.outputs.app_ref }} ($(git rev-parse --short HEAD))" | tee $LOG
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1
          xcodegen generate --spec project.yml > build/logs/xcodegen.txt 2>&1 || { echo "xcodegen failed"; tail -50 build/logs/xcodegen.txt; exit 1; }
          pick() {  # $1 = runtime marker, $2 = name filter, $3 = preferred prefix
            xcrun simctl list devices available -j | python3 -c '
          import json,sys
          rt_mark,flt,pref=sys.argv[1:4]
          d=json.load(sys.stdin)["devices"]; best=None
          for rt,devs in d.items():
              if rt_mark not in rt: continue
              ver=tuple(int(x) for x in rt.split(rt_mark)[1].split("-"))
              for x in devs:
                  n=x["name"]
                  if flt not in n: continue
                  rank=(ver, n.startswith(pref), n)
                  if best is None or rank>best[0]: best=(rank,x["udid"],n)
          print((best[1]+"|"+best[2]) if best else "")' "$1" "$2" "$3"; }
          statusbar() {
            xcrun simctl status_bar "$1" override --time 9:41 --batteryState charged --batteryLevel 100 \
              --cellularBars 4 --wifiBars 3 --dataNetwork wifi --wifiMode active --cellularMode active >> $LOG 2>&1 \
              || xcrun simctl status_bar "$1" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 >> $LOG 2>&1 \
              || echo "status bar override failed" >> $LOG
          }
          SIM=$(pick ".iOS-" "Pro Max" "iPhone 17")
          UDID=${SIM%%|*}; NAME=${SIM#*|}
          echo "Screenshot simulator: ${NAME:-none}" | tee -a $LOG
          [ -n "$UDID" ] || { echo "no Pro Max simulator available" | tee -a $LOG; exit 1; }
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          statusbar "$UDID"
          T=BikeComputerUITests/StoreScreenshots
          XB=(xcodebuild -project BikeComputer.xcodeproj -scheme BikeComputer -configuration Debug -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO)
          "${XB[@]}" build-for-testing > build/xcodebuild-build.log 2>&1 || { echo "build-for-testing failed" | tee -a $LOG; grep -E "error:" build/xcodebuild-build.log | head -40 | tee -a $LOG; exit 1; }
          run_test() {  # $1 = appearance, $2 = test id, $3 = log name
            xcrun simctl ui "$UDID" appearance "$1" || true
            statusbar "$UDID"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/build/shots" "${XB[@]}" test-without-building -only-testing:"$2" > "build/$3.log" 2>&1
            local rc=$?
            grep -E "error:|Test Case .* (passed|failed|skipped)|Executed [0-9]+ test|\*\* .* (SUCCEEDED|FAILED) \*\*" "build/$3.log" | head -60 >> $LOG
            echo "$2 ($1 appearance): exit $rc" >> $LOG
          }
          # home/strength/plan/progress in light; the ride screen is dark, so its run uses dark appearance (white status bar)
          run_test light "$T/test1StrengthDay" light
          run_test dark "$T/test2RideDay" dark
          if ! ls build/shots/*.png >/dev/null 2>&1; then
            echo "per-test runs produced nothing; running the whole StoreScreenshots class in light" >> $LOG
            run_test light "$T" all
          fi
          xcrun simctl ui "$UDID" appearance light || true

          # best effort: one Apple Watch screenshot of the companion app (needed because the build contains a Watch app)
          W=$(pick ".watchOS-" "Ultra" "Apple Watch Ultra 3")
          WUDID=${W%%|*}; WNAME=${W#*|}
          echo "Watch simulator: ${WNAME:-none}" >> $LOG
          if [ -n "$WUDID" ]; then
            xcrun simctl boot "$WUDID" 2>/dev/null || true
            xcrun simctl bootstatus "$WUDID" -b >/dev/null 2>&1 || true
            xcrun simctl status_bar "$WUDID" override --time 9:41 >> $LOG 2>&1 || true
            if xcodebuild -project BikeComputer.xcodeproj -target BikeComputerWatch -sdk watchsimulator -configuration Debug \
                 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build/wsym" build > build/xcodebuild-watch.log 2>&1; then
              WAPP=$(find build/wsym -maxdepth 3 -name "*.app" -path "*watchsimulator*" | head -1)
              xcrun simctl install "$WUDID" "$WAPP" >> $LOG 2>&1 && \
              xcrun simctl launch "$WUDID" com.ralsuwaidico.bikecomputer.watchkitapp >> $LOG 2>&1 && sleep 8 && \
              xcrun simctl io "$WUDID" screenshot build/shots/06-watch.png >> $LOG 2>&1 || echo "watch screenshot failed" >> $LOG
            else
              echo "watch build failed:" >> $LOG; grep -E "error:" build/xcodebuild-watch.log | head -20 >> $LOG
            fi
          fi
          for f in build/shots/*.png; do [ -f "$f" ] && echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')" >> $LOG; done
          cat $LOG
          ls build/shots/0[1-5]*.png >/dev/null 2>&1 || exit 1
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            ios/build/shots/*.png
            ios/build/logs/screenshots.txt
          if-no-files-found: ignore

  listing:
    needs: [plan, screenshots]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Fetch screenshots
        if: ${{ needs.plan.outputs.mode == 'screenshots' }}
        uses: actions/download-artifact@v4
        with:
          name: store-screenshots
          path: shots
        continue-on-error: true
      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MODE: ${{ needs.plan.outputs.mode }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build }}
          SHOTS_OK: ${{ needs.screenshots.result }}
        run: |
          mkdir -p shots flat
          find shots -name '*.png' -exec cp {} flat/ \; 2>/dev/null || true
          if [ "$MODE" = "screenshots" ] && [ "$SHOTS_OK" != "success" ]; then
            echo "screenshot job did not succeed ($SHOTS_OK): nothing uploaded, read-only report instead"; MODE=check
          fi
          export MODE SCREENSHOT_DIR="$PWD/flat" REPORT="$PWD/report.txt"
          echo "mode $MODE, screenshots received: $(ls flat | wc -l)"
          python3 ios/ci/asc_listing.py 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail hidden>/g' > run.txt || echo "LISTING SCRIPT FAILED" >> run.txt
          cat run.txt
          [ -f report.txt ] || cp run.txt report.txt
      - name: Publish the report and screenshots to branch ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
          MODE: ${{ needs.plan.outputs.mode }}
          APP_REF: ${{ needs.plan.outputs.app_ref }}
        run: |
          W=$(mktemp -d); cd "$W"
          git init -q && git config user.name "ios-ci" && git config user.email "ios-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          D="ios/asc-listing/run-$N"; mkdir -p "$D/screenshots"
          cp "$GITHUB_WORKSPACE/report.txt" "$D/report.txt" 2>/dev/null || echo "no report" > "$D/report.txt"
          cp "$GITHUB_WORKSPACE/run.txt" "$D/run.txt" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/shots" -name 'screenshots.txt' -exec cp {} "$D/screenshots.txt" \; 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/flat/*.png "$D/screenshots/" 2>/dev/null || true
          echo "mode $MODE  commit $GITHUB_SHA  trigger $GITHUB_REF_NAME  app code $APP_REF" >> "$D/report.txt"
          git add -A && git commit -q -m "App Store listing run $N ($MODE)" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:ci-logs && break; git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true; sleep 3; done

# BikeComputer firmware CI (CI improvement 3, 28 Oct 2026): the existing host tests (incl. the iOS↔firmware protocol
# fixtures), the BLE glue stress / priority / init-failure harness, the ESP-IDF 5.5.1 build and the LVGL simulator, on every
# push that touches the firmware. Build only — nothing is ever flashed, no board is touched. Results are reported in the job
# summary and as annotations (readable through the API).
name: Firmware
on:
  push:
    branches: ["fw/**", "ios/**", "fix/**"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Host tests + BLE harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (bc_core, storage, boot records, partitions, Link 1.2.3 + 1.3 fixtures)
        shell: bash
        run: |
          s=$(date +%s); make -C firmware/waveshare/test/host > host.txt 2>&1; X=$?
          echo "::notice title=Host tests::$([ $X -eq 0 ] && echo ok || echo "FAILED (exit $X)") in $(( $(date +%s) - s ))s — $(grep -Eo '[a-z_0-9]+: [0-9]+ checks, [0-9]+ failed' host.txt | tr '\n' ' ' | cut -c1-600)"
          [ $X -eq 0 ] || tail -30 host.txt | while IFS= read -r l; do echo "::error title=host::${l//%/%25}"; done
          { echo "### Host tests: $([ $X -eq 0 ] && echo ok || echo FAILED)"; echo '```'; grep -E "checks|FAIL|error" host.txt | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $X
      - name: BLE glue harness (stress ASan, priority, init failures)
        shell: bash
        run: |
          s=$(date +%s); make -C firmware/waveshare/test/blehost all > ble.txt 2>&1; X=$?
          echo "::notice title=BLE harness::$([ $X -eq 0 ] && echo ok || echo "FAILED (exit $X)") in $(( $(date +%s) - s ))s — $(grep -E 'PASS|FAIL|checks' ble.txt | tail -6 | tr '\n' ' ' | cut -c1-600)"
          [ $X -eq 0 ] || tail -30 ble.txt | while IFS= read -r l; do echo "::error title=blehost::${l//%/%25}"; done
          { echo "### BLE harness: $([ $X -eq 0 ] && echo ok || echo FAILED)"; echo '```'; grep -E "PASS|FAIL|checks|error" ble.txt | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $X
  idf:
    name: ESP-IDF build + simulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build (ESP32-S3, the shipped sdkconfig and partition table)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          export IDF_COMPONENT_MANAGER=0
          cd firmware/waveshare
          s=$(date +%s); idf.py build > ../../idf.txt 2>&1; X=$?
          SIZE=$(ls -l build/*.bin 2>/dev/null | awk '{print $5" "$9}' | grep -v bootloader | head -1)
          echo "::notice title=idf.py build::$([ $X -eq 0 ] && echo ok || echo "FAILED (exit $X)") in $(( $(date +%s) - s ))s — app ${SIZE:-n/a}"
          [ $X -eq 0 ] || grep -E "error:|Error" ../../idf.txt | head -20 | while IFS= read -r l; do echo "::error title=idf::${l//%/%25}"; done
          exit $X
      - name: LVGL simulator (scripted scenario, all screens)
        shell: bash
        run: |
          apt-get update -qq >/dev/null && apt-get install -y -qq build-essential >/dev/null 2>&1 || true
          s=$(date +%s); make -C firmware/waveshare/test/sim run > sim.txt 2>&1; X=$?
          echo "::notice title=Simulator::$([ $X -eq 0 ] && echo ok || echo "FAILED (exit $X)") in $(( $(date +%s) - s ))s — $(grep -Eo '[0-9]+ screens.*' firmware/waveshare/test/sim/out/report.txt 2>/dev/null | tail -1 | cut -c1-300)"
          [ $X -eq 0 ] || tail -30 sim.txt | while IFS= read -r l; do echo "::error title=sim::${l//%/%25}"; done
          exit $X
